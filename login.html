<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizCore Login</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABEUlEQVR4nGNgGAWjYIABIzmavtRo/Ufm87RcI8scshzwqUrjPzZxvrYbZDmChVQN//9jtZ9sMAQd8G+gHTDQIfBvoB1ASgho1T9AUXytUQEjpzCR7IB//7BidKBRffv/vz+/GZCxRvVtDNfTLAT+/flDlLph7IC/NHLAPyLLAbJDQCr/CooNzybqoKRcakcBSi6QyDr3/9/vXwzIWCLrHIqN////x4qxOQAbRgcoIfD/z2+CLqZpGvj3+xdhB2DJ81gdQIRnMBxA1RAgJxES42pi6wKyHPCfmCigaRogJgpoWQ5QNQSIdABG9cjjvhjFhi87YzHU3EoQRFGjtuA91gYpj9siVLN2xZHdeh4FwxcAACb84Rmry2tMAAAAAElFTkSuQmCC">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0B539D,#083d7a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.logo-area{text-align:center;margin-bottom:24px}
.logo-area img{height:48px;width:auto;max-width:200px;object-fit:contain}
.app-name{font-size:24px;font-weight:800;color:#0B539D}
.app-sub{font-size:12px;color:#8B98A8;margin-top:4px}
.divider{height:1px;background:#EEF1F4;margin:20px 0}
.title{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.subtitle{font-size:13px;color:#5A6677;margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px}
.field input{width:100%;height:44px;border:1.5px solid #E2E8F0;border-radius:8px;padding:0 14px;font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
.field input:focus{border-color:#0B539D;box-shadow:0 0 0 3px rgba(11,83,157,.1)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#8B98A8;padding:4px;font-size:16px;line-height:1}
.btn-login{width:100%;height:46px;background:#0B539D;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn-login:hover{background:#094382}
.btn-login:disabled{background:#93b8d6;cursor:not-allowed}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.loading .spinner{display:block}
.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.error{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;color:#DC2626;margin-top:12px;display:none;align-items:center;gap:8px}
.error.show{display:flex}
.footer{text-align:center;margin-top:22px;font-size:11px;color:#8B98A8}
.footer b{color:#0B539D}
@media(max-width:480px){.card{padding:28px 20px}}
</style>
</head>
<body>

<div class="card">
  <div class="logo-area" id="logo-area">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 88" width="220" height="64" style="display:block;margin:0 auto">
      <defs>
        <linearGradient id="loginBar1" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#0B439E"/><stop offset="100%" stop-color="#1A6FD4"/>
        </linearGradient>
        <linearGradient id="loginBar2" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#0B439E"/><stop offset="100%" stop-color="#2A7FE0"/>
        </linearGradient>
        <linearGradient id="loginBarO" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#D95F10"/><stop offset="100%" stop-color="#F47C2A"/>
        </linearGradient>
      </defs>
      <g transform="translate(14,10)">
        <rect x="0" y="58" width="56" height="2.5" rx="1.25" fill="#0B439E" opacity="0.15"/>
        <rect x="2" y="38" width="13" height="20" rx="2.5" fill="url(#loginBar1)"/>
        <rect x="21.5" y="14" width="13" height="44" rx="2.5" fill="url(#loginBarO)"/>
        <rect x="41" y="26" width="13" height="32" rx="2.5" fill="url(#loginBar2)"/>
      </g>
      <g transform="translate(90,4)">
        <text x="0" y="54" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="300" fill="#0B439E">Biz</text>
        <text x="62" y="54" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#0B439E">Core</text>
        <text x="1" y="70" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" letter-spacing="3" fill="#5A7BB5">BUSINESS OPERATIONS</text>
      </g>
    </svg>
    <div class="app-sub" style="margin-top:6px">Downtown Trading Est.</div>
  </div>

  <div class="divider"></div>

  <div class="title">Welcome back</div>
  <div class="subtitle">Sign in with your account to continue</div>

  <div class="field">
    <label>Email address</label>
    <input type="email" id="inp-email" placeholder="your@email.com" autocomplete="email">
  </div>

  <div class="field">
    <label>Password</label>
    <div class="pw-wrap">
      <input type="password" id="inp-pw" placeholder="Enter your password" autocomplete="current-password">
      <button class="pw-toggle" type="button" onclick="togglePw()" tabindex="-1">
        <i class="ti ti-eye" id="pw-icon"></i>
      </button>
    </div>
  </div>

  <button class="btn-login" id="btn-login" onclick="doLogin()" type="button">
    <div class="spinner"></div>
    <span class="btn-text">Sign in</span>
  </button>

  <div class="error" id="err-box">
    <i class="ti ti-alert-circle" style="flex-shrink:0"></i>
    <span id="err-msg">Invalid email or password.</span>
  </div>

  <div class="footer"><b>BizCore</b> &nbsp;·&nbsp; Downtown Trading Est. &nbsp;·&nbsp; Riyadh, KSA</div>
</div>

<script type="module">
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const cfg = {
  apiKey:            'AIzaSyCsgVVIU_AZpWgTrZo_jrlCQVgZusCI_zY',
  authDomain:        'bizcore-downtown.firebaseapp.com',
  projectId:         'bizcore-downtown',
  storageBucket:     'bizcore-downtown.firebasestorage.app',
  messagingSenderId: '864406054158',
  appId:             '1:864406054158:web:190929f0cc60e12e77e35f'
};

const app  = initializeApp(cfg);
const auth = getAuth(app);
const db   = getFirestore(app);

// If already logged in go straight to app
onAuthStateChanged(auth, function(user) {
  if (user) { window.location.href = 'index.html'; }
});

// Try to load company logo from Firestore
async function loadLogo() {
  try {
    var snap = await getDoc(doc(db, 'settings', 'main'));
    if (snap.exists()) {
      var s = JSON.parse(snap.data().data || '{}');
      if (s && s.logo) {
        var area = document.getElementById('logo-area');
        var img  = document.createElement('img');
        img.src  = s.logo;
        area.innerHTML = '';
        area.appendChild(img);
        var sub = document.createElement('div');
        sub.className   = 'app-sub';
        sub.textContent = 'Downtown Trading Est.';
        area.appendChild(sub);
      }
    }
  } catch(e) { /* logo load failed silently */ }
}
loadLogo();

// Login
window.doLogin = async function() {
  var email = document.getElementById('inp-email').value.trim();
  var pw    = document.getElementById('inp-pw').value;
  var btn   = document.getElementById('btn-login');
  var err   = document.getElementById('err-box');
  var msg   = document.getElementById('err-msg');

  err.classList.remove('show');

  if (!email || !pw) {
    msg.textContent = 'Please enter your email and password.';
    err.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');

  try {
    await signInWithEmailAndPassword(auth, email, pw);
    // onAuthStateChanged above will redirect
  } catch(e) {
    btn.disabled = false;
    btn.classList.remove('loading');
    var m = 'Incorrect email or password. Please try again.';
    if (e.code === 'auth/invalid-email')          m = 'Please enter a valid email address.';
    if (e.code === 'auth/user-not-found')         m = 'No account found with this email.';
    if (e.code === 'auth/wrong-password')         m = 'Incorrect password. Please try again.';
    if (e.code === 'auth/too-many-requests')      m = 'Too many attempts. Please wait a few minutes.';
    if (e.code === 'auth/network-request-failed') m = 'No internet connection. Please check and retry.';
    if (e.code === 'auth/invalid-credential')     m = 'Incorrect email or password. Please try again.';
    msg.textContent = m;
    err.classList.add('show');
    document.getElementById('inp-pw').value = '';
    document.getElementById('inp-pw').focus();
  }
};

// Toggle password visibility
window.togglePw = function() {
  var inp  = document.getElementById('inp-pw');
  var icon = document.getElementById('pw-icon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'ti ti-eye-off';
  } else {
    inp.type = 'password';
    icon.className = 'ti ti-eye';
  }
};

// Enter key submits
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') window.doLogin();
});
</script>
</body>
</html>
