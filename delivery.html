<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>
<title>Delivery Access</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#172033;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(430px,100%);background:#fff;border:1px solid #dfe6ee;border-radius:16px;box-shadow:0 18px 48px rgba(15,23,42,.12);padding:30px 26px;text-align:center}.icon{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#edf5ff;color:#0b539d;font-size:27px;font-weight:800}.title{font-size:23px;font-weight:750;margin:0 0 9px}.text{font-size:14px;line-height:1.55;color:#64748b;margin:0 auto 22px;max-width:330px}.btn{width:100%;height:46px;border:0;border-radius:9px;background:#0b539d;color:#fff;font-size:14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.small{font-size:11px;color:#94a3b8;margin-top:17px;line-height:1.45}.error .icon{background:#fff1f2;color:#be123c}.spinner{width:22px;height:22px;border:3px solid #dbeafe;border-top-color:#0b539d;border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="icon" id="access-icon">✓</div>
  <h1 class="title" id="access-title">Delivery Access</h1>
  <p class="text" id="access-text">Checking authorized access…</p>
  <div id="access-action"><div class="spinner"></div></div>
  <div class="small">No delivery or customer information is displayed until an authorized employee signs in.</div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
const cfg={apiKey:'AIzaSyCsgVVIU_AZpWgTrZo_jrlCQVgZusCI_zY',authDomain:'bizcore-downtown.firebaseapp.com',projectId:'bizcore-downtown',storageBucket:'bizcore-downtown.firebasestorage.app',messagingSenderId:'864406054158',appId:'1:864406054158:web:190929f0cc60e12e77e35f'};
const token=new URLSearchParams(location.search).get('t')||'';
const title=document.getElementById('access-title'),text=document.getElementById('access-text'),action=document.getElementById('access-action'),card=document.getElementById('card');
function unavailable(){card.classList.add('error');document.getElementById('access-icon').textContent='!';title.textContent='Delivery link unavailable';text.textContent='This delivery access link is invalid or unavailable.';action.innerHTML='';}
if(!/^[a-f0-9]{48}$/i.test(token)){unavailable();}
else{
 const auth=getAuth(initializeApp(cfg));
 onAuthStateChanged(auth,user=>{
   if(user){location.replace('index.html?delivery='+encodeURIComponent(token));return;}
   title.textContent='Delivery Access';text.textContent='Authorized personnel only. Sign in with your employee account to continue.';
   action.innerHTML='<button class="btn" id="employee-signin" type="button">Employee Sign In</button>';
   document.getElementById('employee-signin').onclick=()=>{const ret='index.html?delivery='+encodeURIComponent(token);location.href='login.html?return='+encodeURIComponent(ret);};
 });
}
</script>
</body>
</html>
